services:
  - type: web
    name: collab-prospector-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: SMARTLEAD_API_KEY
        sync: false
